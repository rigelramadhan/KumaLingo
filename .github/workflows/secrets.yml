name: Secret checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: node scripts/setup-secret-checks.mjs --no-hooks
      - run: node scripts/test-secret-checks.mjs
      - run: node scripts/check-secrets.mjs history
      - run: node scripts/check-secrets.mjs working-tree
