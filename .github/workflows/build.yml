name: Build and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm --prefix webBridge ci --ignore-scripts
      - run: npm --prefix webBridge run test:exports
      - run: npm --prefix webBridge run test:runtime
      - run: ./gradlew :shared:jvmTest :composeApp:wasmJsBrowserDistribution --no-daemon
      - run: npx playwright install --with-deps chromium
        working-directory: webBridge
      - run: npm --prefix webBridge run test:browser
      - run: npx --yes firebase-tools@15.35.0 emulators:exec --project demo-kumalingo --only firestore "npm --prefix webBridge run test:rules"
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm --prefix worker ci --ignore-scripts
      - run: npm --prefix worker run typecheck
      - run: npm --prefix worker test
      - run: npm --prefix worker run build
        env:
          WRANGLER_SEND_METRICS: 'false'
